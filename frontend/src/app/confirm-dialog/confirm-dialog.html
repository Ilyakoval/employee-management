<div class="overlay" (click)="closed.emit()">
  <div class="dialog dialog-sm" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      <h2>{{ title() }}</h2>
      <button type="button" class="icon-btn" aria-label="Close" (click)="closed.emit()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="dialog-body">
      <p>{{ message() }}</p>
      @if (error()) {
        <div class="server-error" role="alert">{{ error() }}</div>
      }
    </div>

    <footer class="dialog-footer dialog-footer-padded">
      <button type="button" class="btn btn-ghost" (click)="closed.emit()">Cancel</button>
      <button type="button" class="btn btn-danger" [disabled]="busy()" (click)="confirmed.emit()">
        {{ busy() ? 'Deleting…' : confirmLabel() }}
      </button>
    </footer>
  </div>
</div>
